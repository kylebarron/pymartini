[project]
name = "pymartini"
version = "0.5.1"
description = "A Python port of Martini for fast terrain mesh generation"
readme = "README.md"
authors = [{ name = "Kyle Barron", email = "kylebarron2@gmail.com" }]
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
keywords = ["mesh", "heightmap", "elevation", "terrain", "numpy"]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/kylebarron/pymartini"
Repository = "https://github.com/kylebarron/pymartini"
Issues = "https://github.com/kylebarron/pymartini/issues"
Changelog = "https://github.com/kylebarron/pymartini/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["imageio>=2.9", "pytest>=8"]
docs = [
    # Workaround for https://github.com/mkdocs/mkdocs/issues/4032
    "click<8.3",
    "mkdocs-material[imaging]>=9.5.49",
    "mkdocs>=1.6.1,<2",
    "mkdocstrings[python]>=1.0",
    "mike>=2.1.3",
    # We use ruff format ourselves, but mkdocstrings requires black to be
    # installed to format signatures in the docs
    "black>=24",
]

# The docs toolchain needs a newer Python than the package itself supports
[tool.uv.dependency-groups]
docs = { requires-python = ">=3.10" }

[build-system]
# numpy is needed at build time for its C headers. Building against numpy 2
# produces an extension that works with both numpy 1.x and 2.x at runtime.
requires = ["setuptools>=77", "cython", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pymartini", "pymartini.*"]

[tool.cibuildwheel]
skip = "cp38*"
test-groups = ["dev"]
test-command = "pytest {project}/tests"

[tool.pytest.ini_options]
# Import the installed package rather than adding the repository root to
# sys.path. This matters when cibuildwheel tests a built wheel: the source
# checkout's `pymartini/` has no compiled extension.
addopts = ["--import-mode=importlib"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # trailing comma; conflicts with ruff format
    "CPY001", # copyright header
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "EM101",  # raw string in exception
    "EM102",  # f-string in exception
    "FIX002", # todo statements
    "TD002",  # todo without author name
    "TRY003", # define exceptions in the exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN001",  # annotation in function argument
    "ANN201",  # return type annotation
    "PLR2004", # Magic value used in comparison
    "S101",    # assert
    "SLF001",  # private member access
    "D",       # docstring
]
"*.pyi" = [
    "PYI021", # docstrings in stubs; mkdocstrings renders the Cython API from them
]
"bench.py" = [
    "D",      # docstring
    "INP001", # implicit namespace package
    "T201",   # print
]
